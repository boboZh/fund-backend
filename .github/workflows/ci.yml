name: Backend CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install & Test
        run: |
          npm install
          npm run test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test deployment recovery logic
        run: python -m unittest discover -s deploy/tests -v
